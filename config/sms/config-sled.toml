[grpc]
addr = "0.0.0.0:50051"
enable_tls = false

[http]
addr = "0.0.0.0:8080"
enable_tls = false

enable_swagger = true
enable_web_admin = false
enable_console = true
heartbeat_timeout = 120
cleanup_interval = 300
assignment_reconcile_interval = 60
max_upload_bytes = 67108864
execution_logs_dir = "./data/execution_logs"

[object_storage]
backend = "local_fs"

[object_storage.local_fs]
root_dir = "./data/objects"

[object_storage.rustfs]
endpoint = ""
bucket = ""
root = ""
region = "us-east-1"
access_key = ""
secret_key = ""
path_style = true
connect_timeout_ms = 3000
read_timeout_ms = 10000
write_timeout_ms = 10000
create_bucket_if_missing = true

[web_admin]
addr = "0.0.0.0:8081"
enable_tls = false

[database]
db_type = "sled"
path = "./data/node-service.db"
pool_size = 10

[event_kv]
backend = "sled"
params = { path = "./data/events-sled.db" }

[logging]
level = "info"
format = "json"
file = "./logs/sms.log"
