# SMS (SPEAR Metadata Server) Configuration / SMS（SPEAR元数据服务器）配置

# Enable Swagger UI / 启用Swagger UI
enable_swagger = true

# Enable Web Admin / 启用Web管理页面
enable_web_admin = true

# Enable SPEAR Console (/console) / 启用控制台（/console）
enable_console = true

# Heartbeat timeout / 心跳超时
heartbeat_timeout = 90

# Cleanup interval / 清理间隔
cleanup_interval = 30

# Periodic task assignment reconcile interval / 周期性任务分配收敛间隔
assignment_reconcile_interval = 60

# Max upload size / 最大上传字节数
max_upload_bytes = 67108864

# Object storage configuration / 对象存储配置
[object_storage]
# Active backend: "local_fs" or "rustfs" / 当前后端："local_fs" 或 "rustfs"
backend = "local_fs"

[object_storage.local_fs]
# Local compatibility blob root directory / 本地兼容 Blob 根目录
root_dir = "./data/objects"

[object_storage.rustfs]
# RustFS service endpoint / RustFS 服务地址
endpoint = ""
# RustFS bucket or namespace / RustFS bucket 或命名空间
bucket = ""
# Optional key prefix inside the bucket / bucket 内的可选 key 前缀
root = ""
# S3-compatible region / S3-compatible region
region = "us-east-1"
# Optional static access key, empty means using default credential chain / 可选静态 access key，留空表示使用默认凭证链
access_key = ""
# Optional static secret key, empty means using default credential chain / 可选静态 secret key，留空表示使用默认凭证链
secret_key = ""
# Use path-style addressing for RustFS / 对 RustFS 使用 path-style 寻址
path_style = true
# Connect timeout in milliseconds / 连接超时时间（毫秒）
connect_timeout_ms = 3000
# Read timeout in milliseconds / 读取超时时间（毫秒）
read_timeout_ms = 10000
# Write timeout in milliseconds / 写入超时时间（毫秒）
write_timeout_ms = 10000
# Create bucket automatically when missing / 缺失时自动创建 bucket
create_bucket_if_missing = true

# Execution logs directory / 执行日志目录
execution_logs_dir = "./data/execution_logs"

[grpc]
# gRPC bind address / gRPC绑定地址
addr = "127.0.0.1:50051"
# Enable TLS / 启用TLS
enable_tls = false

[http]
# HTTP bind address / HTTP绑定地址
addr = "127.0.0.1:8080"
# Enable TLS / 启用TLS
enable_tls = false

[web_admin]
# Web Admin bind address / Web管理页面绑定地址
addr = "127.0.0.1:8081"
enable_tls = false

[database]
# Database type: "rocksdb" or "sled" / 数据库类型："rocksdb" 或 "sled"
db_type = "sled"
# Database path / 数据库路径
path = "./data/sms.db"
# Connection pool size / 连接池大小
pool_size = 10

[event_kv]
backend = "memory"
params = {}

[mcp]
dir = "./config/sms/mcp.d"

[logging]
# Log level: trace/debug/info/warn/error / 日志级别
level = "debug"
# Log format: json/pretty / 日志格式
format = "pretty"
# Log output file (optional) / 日志输出文件（可选）
file = "./logs/sms.log"
