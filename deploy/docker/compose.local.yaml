name: spear-local

services:
  debug-server:
    build:
      context: ../..
      dockerfile: deploy/docker/debug-server/Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.91-bookworm}
        DEBIAN_IMAGE: ${DEBUG_SERVER_DEBIAN_IMAGE:-debian:bookworm-slim}
        CARGO_BUILD_PROFILE: ${DEBUG_SERVER_CARGO_BUILD_PROFILE:-dev}
        CARGO_OUTPUT_DIR: ${DEBUG_SERVER_CARGO_OUTPUT_DIR:-debug}
    image: spear-debug-server:local
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "7777"
      - --session
      - ${DEBUG_SESSION_ID:-default-session}
      - --outdir
      - /dbg
      - --idle
      - ${DEBUG_SERVER_IDLE_SECS:-1200}
    expose:
      - "7777"
    ports:
      - ${DEBUG_SERVER_PORT:-17777}:7777
    volumes:
      - ../../.dbg:/dbg

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command:
      - /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - ${RUSTFS_API_PORT:-19000}:9000
      - ${RUSTFS_CONSOLE_PORT:-19001}:9001
    volumes:
      - rustfs-data:/data

  sms:
    build:
      context: ../..
      dockerfile: deploy/docker/sms/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.91-bookworm}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-debian:trixie-slim}
        USE_CARGO_MIRROR: ${USE_CARGO_MIRROR:-1}
        CARGO_BUILD_PROFILE: ${SMS_CARGO_BUILD_PROFILE:-dev}
        CARGO_OUTPUT_DIR: ${SMS_CARGO_OUTPUT_DIR:-debug}
    image: spear-sms:local
    restart: unless-stopped
    depends_on:
      - rustfs
    command:
      - sms
      - --grpc-addr
      - 0.0.0.0:50051
      - --http-addr
      - 0.0.0.0:8080
      - --enable-console
      - --enable-web-admin
      - --web-admin-addr
      - 0.0.0.0:8081
      - --db-type
      - rocksdb
      - --db-path
      - /var/lib/sms/rocksdb
      - --execution-logs-dir
      - /var/lib/sms/execution_logs
    environment:
      SMS_LOG_LEVEL: ${SMS_LOG_LEVEL:-info}
      SMS_LOG_FORMAT: ${SMS_LOG_FORMAT:-json}
      SMS_CREDENTIAL_MASTER_KEY: ${SMS_CREDENTIAL_MASTER_KEY:-local-dev-master-key}
      SMS_EVENTS_KV_BACKEND: rocksdb
      SMS_EVENTS_KV_PATH: /var/lib/sms/events-rocksdb
      SMS_OBJECT_STORAGE_BACKEND: rustfs
      SMS_OBJECT_STORAGE_RUSTFS_ENDPOINT: http://rustfs:9000
      SMS_OBJECT_STORAGE_RUSTFS_BUCKET: ${SMS_OBJECT_STORAGE_RUSTFS_BUCKET:-sms-objects}
      SMS_OBJECT_STORAGE_RUSTFS_ROOT: ${SMS_OBJECT_STORAGE_RUSTFS_ROOT:-local}
      SMS_OBJECT_STORAGE_RUSTFS_REGION: ${SMS_OBJECT_STORAGE_RUSTFS_REGION:-us-east-1}
      SMS_OBJECT_STORAGE_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      SMS_OBJECT_STORAGE_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      SMS_OBJECT_STORAGE_RUSTFS_PATH_STYLE: "true"
    ports:
      - ${SMS_GRPC_PORT:-50051}:50051
      - ${SMS_HTTP_PORT:-18080}:8080
      - ${SMS_WEB_ADMIN_PORT:-18082}:8081
    volumes:
      - sms-data:/var/lib/sms

  spearlet:
    build:
      context: ../..
      dockerfile: deploy/docker/spearlet/Dockerfile
      target: ${SPEARLET_BUILD_TARGET:-runtime_with_node_and_llama}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.91-bookworm}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-debian:trixie-slim}
        USE_CARGO_MIRROR: ${USE_CARGO_MIRROR:-1}
        CARGO_BUILD_PROFILE: ${SPEARLET_CARGO_BUILD_PROFILE:-dev}
        CARGO_OUTPUT_DIR: ${SPEARLET_CARGO_OUTPUT_DIR:-debug}
    image: spear-spearlet:local
    restart: unless-stopped
    depends_on:
      - sms
    command:
      - spearlet
      - --sms-grpc-addr
      - sms:50051
      - --sms-http-addr
      - sms:8080
      - --node-name
      - ${SPEARLET_NODE_NAME:-spearlet-local}
    environment:
      SPEARLET_LOG_LEVEL: ${SPEARLET_LOG_LEVEL:-info}
      SPEARLET_LOG_FORMAT: ${SPEARLET_LOG_FORMAT:-json}
      SPEARLET_ADVERTISE_IP: ${SPEARLET_ADVERTISE_IP:-spearlet}
      SPEARLET_LOCAL_MODELS_DIR: ${SPEARLET_LOCAL_MODELS_DIR:-/var/lib/spearlet/local_models}
      SPEARLET_STORAGE_DATA_DIR: ${SPEARLET_STORAGE_DATA_DIR:-/var/lib/spearlet/storage}
      DEBUG_SERVER_URL: ${DEBUG_SERVER_URL:-http://debug-server:7777/event}
      DEBUG_SESSION_ID: ${DEBUG_SESSION_ID:-default-session}
      DEBUG_CLIENT_NAME: ${DEBUG_CLIENT_NAME:-default-client}
      DEBUG_STREAM_NAME: ${DEBUG_STREAM_NAME:-default-stream}
    ports:
      - ${SPEARLET_GRPC_PORT:-50052}:50052
      - ${SPEARLET_HTTP_PORT:-18081}:8081
    volumes:
      - spearlet-data:/var/lib/spearlet

volumes:
  sms-data:
  spearlet-data:
  rustfs-data:
